<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Makan Asset Lab</title>
<style>
:root{--paper:#E6E4E3;--card:#F3F2F1;--ink:#0E0C0C;--muted:#6B6766;--line:#D2CECB;--red:#E0261B;--orange:#FF5A00;--cyan:#19C8FF;--chip:#DCD9D6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#121010;--card:#1C1919;--ink:#EDEBEA;--muted:#9C9795;--line:#2E2A29;--chip:#272322}}
:root[data-theme="dark"]{--paper:#121010;--card:#1C1919;--ink:#EDEBEA;--muted:#9C9795;--line:#2E2A29;--chip:#272322}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:14px 16px 10px}
h1{margin:0;font-size:22px;letter-spacing:-.02em;font-weight:800}
h1 span{color:var(--red)}
.stats{color:var(--muted);font-size:12px;margin:2px 0 10px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search],select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;min-width:0}
input[type=search]{flex:1 1 220px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
label.tog{font-size:12px;color:var(--muted);display:flex;gap:4px;align-items:center}
main{padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .12s}
.card:hover{transform:translateY(-2px);border-color:var(--ink)}
.thumb{aspect-ratio:4/3;background:#0E0C0C10;display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:contain;image-rendering:auto}
.thumb.none{font-size:11px;color:var(--muted);padding:10px;text-align:center}
.meta{padding:8px 10px 10px}
.fn{font-size:12px;font-weight:600;word-break:break-all}
.sub{font-size:11px;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.b{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--chip)}
.b.red{background:var(--red);color:#fff}.b.or{background:var(--orange);color:#fff}.b.cy{background:var(--cyan);color:#000}
dialog{max-width:min(900px,96vw);width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:0}
dialog::backdrop{background:#0008}
.dlg{padding:16px}
.pv{background:repeating-conic-gradient(#E6E4E3 0 25%,#D6D2CF 0 50%) 0 0/24px 24px;border-radius:8px;display:flex;justify-content:center;align-items:center;max-height:60vh;min-height:200px;overflow:hidden}
.pv.dark{background:#0E0C0C}
.pv img,.pv video{max-width:100%;max-height:60vh;object-fit:contain}
.pv img.px{min-width:256px;image-rendering:pixelated}
.pv audio{width:100%;margin:20px}
table{border-collapse:collapse;width:100%;margin-top:12px;font-size:12px}
td{border-top:1px solid var(--line);padding:5px 6px;vertical-align:top;word-break:break-word}
td:first-child{color:var(--muted);width:150px}
.row{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:10px}
button{font:inherit;background:var(--ink);color:var(--paper);border:0;border-radius:8px;padding:6px 12px;cursor:pointer}
a{color:var(--red)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px}
@media (max-width:520px){main{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}header{padding:12px 16px}}
</style>
</head>
<body>
<header>
  <h1>makan <span>asset lab</span></h1>
  <div class="stats" id="stats"></div>
  <div class="controls">
    <input type="search" id="q" placeholder="Search filename, keywords, creator, combo tags…">
    <select id="type"><option value="">All types</option></select>
    <select id="lic"><option value="">All licenses</option></select>
    <select id="combo"><option value="">All combo tags</option></select>
    <select id="match"><option value="">Any reference match</option><option>high</option><option>medium</option><option>low</option></select>
    <label class="tog"><input type="checkbox" id="links"> show link-only</label>
    <button id="theme" type="button" title="Toggle theme">◐</button>
  </div>
  <div class="chips" id="folders"></div>
</header>
<main id="grid"></main>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

  if (d.has_alpha) out.push('<span class="b cy">alpha</span>');
  if (d.download_status !== "downloaded") out.push('<span class="b or">link only</span>');
  arr(d.qc_flags).filter(f => /low_res|watermark|restrict|unverified/.test(f)).forEach(f => out.push(`<span class="b or">${esc(f)}</span>`));
  return out.join("");
}
function render() {
  const rows = DATA.filter(matches);
  const g = $("#grid");
  if (!rows.length) { g.innerHTML = '<div class="empty">No assets match these filters.</div>'; return; }
  g.innerHTML = rows.map(d => {
    const name = d.filename ? d.filename.split("/").pop() : (d.title || d.description || d.source_url || "link");
    const th = d.thumbnail ? `<div class="thumb"><img loading="lazy" src="${esc(d.thumbnail)}" alt=""></div>` : `<div class="thumb none">${esc(d.description||"no preview")}</div>`;
    const dims = d.width ? `${d.width}×${d.height}` : "";
    const dur = d.duration_sec ? `${Number(d.duration_sec).toFixed(1)}s` : "";
    return `<div class="card" data-id="${esc(d.id)}">${th}<div class="meta"><div class="fn">${esc(name)}</div><div class="sub">${esc([d.category_folder, dims, dur, d.license].filter(Boolean).join(" · "))}</div><div class="badges">${badges(d)}</div></div></div>`;
  }).join("");
}
$("#grid").addEventListener("click", e => {
  const c = e.target.closest(".card"); if (!c) return;
  const d = DATA.find(x => x.id === c.dataset.id); if (!d) return;
  const f = d.filename || "";
  let pv = "";
  if (/\.(mp4|webm|mov|m4v|ogv)$/i.test(f)) pv = `<video src="${esc(f)}" controls autoplay loop muted playsinline></video>`;
  else if (/\.(wav|ogg|mp3|flac|m4a|opus)$/i.test(f)) pv = `<div style="width:100%">${d.thumbnail?`<img src="${esc(d.thumbnail)}" style="width:100%">`:""}<audio src="${esc(f)}" controls autoplay></audio></div>`;
  else if (/\.(png|jpe?g|gif|webp|svg|bmp)$/i.test(f)) pv = `<img src="${esc(f)}" alt=""${(d.width||999) < 200 ? ' class="px"' : ""}>`;
  else if (d.thumbnail) pv = `<img src="${esc(d.thumbnail)}" alt="">`;
  const rowsHtml = Object.entries(d).filter(([k]) => !["id","thumbnail"].includes(k)).map(([k,v]) => {
    let val = Array.isArray(v) ? v.join(", ") : v;
    if (/url/.test(k) && val) val = `<a href="${esc(val)}" target="_blank" rel="noopener">${esc(val)}</a>`; else val = esc(val);
    return `<tr><td>${esc(k)}</td><td>${val}</td></tr>`;
  }).join("");
  $("#dlgBody").innerHTML = `<div class="row"><strong>${esc(f || d.title || "link-only lead")}</strong><span><button type="button" id="cp">copy path</button> <button type="button" id="cl">close</button></span></div>${pv?`<div class="pv${/\.(mp4|webm|mov|m4v|ogv|wav|ogg|mp3|flac|m4a|opus)$/i.test(f) || /overlay/.test(f) ? " dark" : ""}">${pv}</div>`:""}<table>${rowsHtml}</table>`;
  $("#cl").onclick = () => $("#dlg").close();
  $("#cp").onclick = () => { try { navigator.clipboard.writeText("MAKAN_VIDEO_LAB/" + f); } catch (_) {} };
  $("#dlg").showModal();
});
$("#dlg").addEventListener("close", () => { $("#dlgBody").innerHTML = ""; });
["#q","#type","#lic","#combo","#match","#links"].forEach(s => $(s).addEventListener("input", render));
$("#theme").onclick = () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
};
render();
</script>
</body>
